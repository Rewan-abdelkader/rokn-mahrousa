<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإيدامات | ركن المحروسة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --primary-color: #1a2e26;
            --gold-color: #b89750;
            --bg-cream: #fbf9f4;
            --text-dark: #2c1d0c;
        }

        body {
            background-color: var(--primary-color);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .menu-page {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(180deg, #1a2e26 0%, #12211b 100%);
            min-height: 100vh;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }

        .page-banner {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid var(--gold-color);
            margin-bottom: 20px;
        }

            .page-banner img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .banner-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 15px;
        }

            .banner-title h1 {
                color: var(--gold-color);
                font-size: 2rem;
                margin: 0;
            }

        .menu-list {
            background: var(--bg-cream);
            border-radius: 20px;
            padding: 20px 15px;
            color: var(--text-dark);
        }

        .menu-title {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 15px;
            font-weight: bold;
        }

        .menu-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

            .menu-table th {
                background-color: var(--gold-color);
                color: #fff;
                padding: 14px 8px;
                font-size: 1.1rem;
                font-weight: bold;
            }

            .menu-table td {
                padding: 12px 8px;
                border-bottom: 1px solid #d4c8b0;
                color: var(--text-dark);
                font-size: 1.05rem;
            }

            .menu-table tr:hover {
                background-color: rgba(184, 151, 80, 0.08);
            }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 25px;
            background: var(--gold-color);
            color: #1a2e26;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

            .back:hover {
                background: #fff;
                transform: translateY(-2px);
            }
    </style>
</head>
<body>

    <div class="menu-page">
        <div class="page-banner">
            <img src="edamat.PNG" alt="الإيدامات">
            <div class="banner-title">
                <h1>الإيدامات</h1>
            </div>
        </div>

        <div class="menu-list">
            <h2 class="menu-title">قائمة الإيدامات</h2>

            <table class="menu-table">
                <thead>
                    <tr>
                        <th>الصنف</th>
                        <th>السعرات</th>
                        <th>صغير</th>
                        <th>كبير</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>ملوخية</td>
                        <td>180</td>
                        <td>4</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>بطاطس</td>
                        <td>300</td>
                        <td>4</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>لوبيا</td>
                        <td>250</td>
                        <td>4</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>فاصوليا</td>
                        <td>250</td>
                        <td>4</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>خضار مشكلة</td>
                        <td>220</td>
                        <td>4</td>
                        <td>6</td>
                    </tr>
                    <tr>
                        <td>بامية</td>
                        <td>250</td>
                        <td>5</td>
                        <td>7</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="index.html" class="back">← العودة للرئيسية</a>
    </div>

</body>
</html>

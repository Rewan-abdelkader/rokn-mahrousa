<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الإيدامات | ركن المحروسة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .menu-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            margin-top: 25px;
            background-color: rgba(255, 255, 255, 0.4);
            border-radius: 8px;
            overflow: hidden;
        }

            .menu-table th {
                background-color: #b89750;
                color: #fff;
                padding: 16px 10px;
                font-size: 1.2rem;
                font-weight: bold;
                border-left: 1px solid rgba(255, 255, 255, 0.3);
            }

                .menu-table th:first-child {
                    border-left: none;
                }

            .menu-table td {
                padding: 15px 10px;
                border-bottom: 1px solid #d4c8b0;
                color: #2c1d0c;
                font-size: 1.1rem;
                border-left: 1px solid rgba(212, 200, 176, 0.5);
            }

                .menu-table td:first-child {
                    border-left: none;
                }

                .menu-table td:nth-child(2) {
                    font-weight: 600;
                    color: #1a1107;
                }

            .menu-table tr:hover {
                background-color: rgba(184, 151, 80, 0.08);
                transition: background-color 0.3s ease;
            }

        .banner-title h1 {
            font-size: 2.3rem;
        }

        .menu-title {
            font-size: 2rem;
            margin: 25px 0 10px 0;
            color: #2c1d0c;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="menu-page">
        <div class="page-banner">
            <img src="edamat.PNG" alt="الإيدامات">
            <div class="banner-title">
                <h1>الإيدامات</h1>
            </div>
        </div>

        <h2 class="menu-title">قسم الإيدامات</h2>

        <div class="menu-list">
            <table class="menu-table" id="dynamic-menu-table">
                <thead>
                    <tr>
                        <th>السعرات الحرارية</th>
                        <th>اسم الصنف</th>
                        <th>صغير</th>
                        <th>كبير</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr>
                        <td colspan="4" style="text-align:center; padding: 20px;">جاري تحميل الأسعار المحدثة... ✨</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="index.html" class="back">← العودة للرئيسية</a>
    </div>

    <!-- سكريبت جلب البيانات أوتوماتيك من ملف الإكسيل على جوجل -->
    <script>
        // حطي رابط ملف الجوجل إكسيل هنا بين العلامتين
        const SHEET_URL = "[https://docs.google.com/spreadsheets/d/1msXFrpGok_tc3eRRQaFSdFgTaW69ZwPrcv-yllH0Pgc/edit?usp=sharing]";

        async function loadMenuFromSheet() {
        try {
        if(SHEET_URL.includes("رابط_ملف")) return; // لو لسه متمش وضع الرابط

        const csvUrl = SHEET_URL.replace(/edit\?usp=sharing.*$/, "export?format=csv");
        const response = await fetch(csvUrl);
        const data = await response.text();

        const rows = data.split('\n').map(row => row.split(','));
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        // يبدأ من الصف الثاني لتخطي العناوين
        for (let i = 1; i < rows.length; i++) {
        const cols = rows[i];
        if (cols.length >= 4 && cols[0].trim() !== '') {
        // نفترض الترتيب في الإكسيل: القسم، اسم الصنف، السعرات، صغير، كبير
        // أو حسب ما هنرتب الأعمدة معاكي
        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td>${cols[2] || '-'}</td>
        <td>${cols[1] || '-'}</td>
        <td>${cols[3] || '-'}</td>
        <td>${cols[4] || '-'}</td>
        `;
        tbody.appendChild(tr);
        }
        }
        } catch (error) {
        console.error("خطأ في جلب البيانات:", error);
        }
        }

        loadMenuFromSheet();
    </script>

</body>
</html>

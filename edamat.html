    <script>
        // حطي رابط ملف الإكسيل هنا
        const SHEET_URL = "[https://docs.google.com/spreadsheets/d/1msXFrpGok_tc3eRRQaFSdFgTaW69ZwPrcv-yllH0Pgc/edit?usp=sharing]";

        async function loadMenuFromSheet() {
        const tbody = document.getElementById('table-body');
        try {
        if(SHEET_URL.includes("رابط_ملف") || !SHEET_URL) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px; color: #b89750;">الرجاء إضافة رابط الإكسيل الصحيح</td></tr>';
        return;
        }

        let csvUrl = SHEET_URL;
        if (csvUrl.includes('/edit')) {
        csvUrl = csvUrl.replace(/\/edit.*$/, '/export?format=csv');
        }

        const response = await fetch(csvUrl);
        const data = await response.text();

        // تقسيم السطور بشكل صحيح مع مراعاة علامات التنسيق
        const rows = data.split(/\r?\n/);
        tbody.innerHTML = '';

        let foundItems = false;
        for (let i = 1; i < rows.length; i++) {
        const row = rows[i].trim();
        if (!row) continue;

        // تحليل الأعمدة بفصل الفواصل بدقة
        const cols = row.split(',').map(item => item.replace(/^["']|["']$/g, '').trim());

        // التأكد أن الصف يخص قسم edamat وأن البيانات كاملة
        if (cols.length >= 5 && cols[0].toLowerCase() === 'edamat') {
        foundItems = true;
        const tr = document.createElement('tr');
        tr.innerHTML = `
        <td>${cols[2] || '-'}</td>
        <td>${cols[1] || '-'}</td>
        <td>${cols[3] || '-'}</td>
        <td>${cols[4] || '-'}</td>
        `;
        tbody.appendChild(tr);
        }
        }

        if (!foundItems) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px;">لا توجد أصناف مطابقة</td></tr>';
        }

        } catch (error) {
        console.error("خطأ:", error);
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 20px; color: red;">تعذر تحميل البيانات، تأكد من الرابط</td></tr>';
        }
        }

        loadMenuFromSheet();
    </script>

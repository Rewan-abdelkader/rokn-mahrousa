<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدجاج | ركن المحروسة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #1a2e26;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .menu-page {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(180deg, #1a2e26 0%, #12211b 100%);
            min-height: 100vh;
        }

        .page-banner {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #b89750;
            margin-bottom: 20px;
        }

            .page-banner img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .banner-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 15px;
        }

            .banner-title h1 {
                color: #b89750;
                font-size: 2rem;
                margin: 0;
            }

        .menu-list {
            background: #fbf9f4;
            border-radius: 20px;
            padding: 20px 15px;
            color: #2c1d0c;
        }

        .menu-title {
            font-size: 1.8rem;
            color: #2c1d0c;
            margin: 10px 0 20px 0;
            font-weight: bold;
        }

        .menu-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

            .menu-table th {
                background-color: #b89750;
                color: #fff;
                padding: 14px 8px;
                font-size: 1.05rem;
                font-weight: bold;
            }

            .menu-table td {
                padding: 12px 8px;
                border-bottom: 1px solid #d4c8b0;
                color: #2c1d0c;
                font-size: 1rem;
            }

            .menu-table tr:hover {
                background-color: rgba(184, 151, 80, 0.08);
            }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 25px;
            background: #b89750;
            color: #1a2e26;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

            .back:hover {
                background: #fff;
            }
    </style>
</head>
<body>

    <div class="menu-page">
        <div class="page-banner">
            <img src="dajaj.JPG" alt="الدجاج">
            <div class="banner-title">
                <h1>الدجاج</h1>
            </div>
        </div>

        <div class="menu-list">
            <h2 class="menu-title">قسم الدجاج</h2>

            <table class="menu-table">
                <thead>
                    <tr>
                        <th>السعرات</th>
                        <th>اسم الصنف</th>
                        <th>نص</th>
                        <th>ربع (صدر/ورك)</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>550</td>
                        <td>دجاج فرن</td>
                        <td>25</td>
                        <td>15 / 14</td>
                    </tr>
                    <tr>
                        <td>500</td>
                        <td>دجاج محمر</td>
                        <td>19</td>
                        <td>15 / 13</td>
                    </tr>
                    <tr>
                        <td>450</td>
                        <td>دجاج شواية</td>
                        <td>19</td>
                        <td>15 / 13</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="index.html" class="back">← العودة للرئيسية</a>
    </div>

</body>
</html>

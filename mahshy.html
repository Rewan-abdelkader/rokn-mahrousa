<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المحاشي | ركن المحروسة</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #1a2e26;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        .menu-page {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(180deg, #1a2e26 0%, #12211b 100%);
            min-height: 100vh;
        }

        .page-banner {
            position: relative;
            width: 100%;
            height: 180px;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid #b89750;
            margin-bottom: 20px;
        }

            .page-banner img {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

        .banner-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
            padding: 15px;
        }

            .banner-title h1 {
                color: #b89750;
                font-size: 2rem;
                margin: 0;
            }

        .menu-list {
            background: #fbf9f4;
            border-radius: 20px;
            padding: 20px 15px;
            color: #2c1d0c;
        }

        .menu-title {
            font-size: 1.8rem;
            color: #2c1d0c;
            margin: 10px 0 20px 0;
            font-weight: bold;
        }

        .menu-table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            background-color: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

            .menu-table th {
                background-color: #b89750;
                color: #fff;
                padding: 12px 10px;
                font-size: 1.05rem;
                font-weight: bold;
                border-left: 1px solid rgba(255,255,255,0.2);
            }

                .menu-table th:first-child {
                    border-left: none;
                }

            .menu-table td {
                padding: 12px 10px;
                border-bottom: 1px solid #d4c8b0;
                border-left: 1px solid rgba(212, 200, 176, 0.4);
                color: #2c1d0c;
                font-size: 1.05rem;
            }

                .menu-table td:first-child {
                    border-left: none;
                }

            .menu-table tr:hover {
                background-color: rgba(184, 151, 80, 0.08);
            }

        .back {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 25px;
            background: #b89750;
            color: #1a2e26;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
        }

            .back:hover {
                background: #fff;
            }
    </style>
</head>
<body>

    <div class="menu-page">
        <div class="page-banner">
            <img src="mahshy.PNG" alt="المحاشي">
            <div class="banner-title">
                <h1>المحاشي</h1>
            </div>
        </div>

        <div class="menu-list">
            <h2 class="menu-title">قسم المحاشي</h2>

            <table class="menu-table">
                <thead>
                    <tr>
                        <th>السعرات الحرارية</th>
                        <th>اسم الصنف</th>
                        <th>صغير</th>
                        <th>كبير</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>300</td>
                        <td>محشي كرنب</td>
                        <td>15</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>250</td>
                        <td>محشي كوسة</td>
                        <td>15</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>300</td>
                        <td>محشي باذنجان</td>
                        <td>15</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>250</td>
                        <td>محشي ورق عنب</td>
                        <td>15</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>350</td>
                        <td>محشي مشكل</td>
                        <td>15</td>
                        <td>20</td>
                    </tr>
                    <tr>
                        <td>550</td>
                        <td>ربع دجاج + محشي</td>
                        <td>20</td>
                        <td>-</td>
                    </tr>
                    <tr>
                        <td>650</td>
                        <td>لحم محمر + محشي</td>
                        <td>35</td>
                        <td>-</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="index.html" class="back">← العودة للرئيسية</a>
    </div>

</body>
</html>
